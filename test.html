<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Femdom Cage Reading Test</title>
<style>
  :root{
    --bg:#181022;
    --panel:#241a33;
    --accent:#c084fc;
    --accent2:#f472b6;
    --text:#f1e9ff;
    --muted:#a89cc0;
    --good:#4ade80;
    --bad:#f87171;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:linear-gradient(160deg,var(--bg),#100a1a 70%);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    overscroll-behavior:none;
  }
  #app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:680px;
    background:var(--panel);
    border-radius:var(--radius);
    padding:32px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.06);
  }
  h1{
    font-size:2em;
    margin:0 0 8px 0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1.2;
  }
  h2{
    font-size:1.4em;
    margin:0 0 16px 0;
    color:var(--accent);
  }
  p{line-height:1.6;color:var(--text);}
  .muted{color:var(--muted);font-size:0.92em;}
  .reading-text{
    background:rgba(0,0,0,0.25);
    border-radius:12px;
    padding:20px;
    max-height:50vh;
    overflow-y:auto;
    -webkit-user-select:none;user-select:none; /* text is not selectable or copyable anywhere in the app */
    line-height:1.7;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,0.05);
  }
  .reading-text p{margin:0 0 14px 0;}
  .reading-text p:last-child{margin-bottom:0;}
  .btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:999px;
    border:none;
    font-size:1em;
    font-weight:600;
    cursor:pointer;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#1a1024;
    transition:transform 0.15s, opacity 0.15s;
    width:100%;
  }
  .btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
    background:#3a3050;
    color:var(--muted);
  }
  .btn:not(:disabled):active{transform:scale(0.98);}
  .timer{
    text-align:center;
    font-size:2.2em;
    font-weight:700;
    margin:18px 0;
    color:var(--accent2);
    letter-spacing:1px;
  }
  .progress-dots{
    display:flex;gap:6px;justify-content:center;margin-bottom:20px;
  }
  .dot{
    width:10px;height:10px;border-radius:50%;
    background:rgba(255,255,255,0.15);
  }
  .dot.active{background:var(--accent2);}
  .dot.done{background:var(--good);}
  .question{
    margin-bottom:22px;
  }
  .question p.qtext{
    font-weight:600;
    margin-bottom:10px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 16px;
    margin-bottom:8px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.03);
    color:var(--text);
    cursor:pointer;
    font-size:0.98em;
  }
  .option.selected{
    border-color:var(--accent);
    background:rgba(192,132,252,0.15);
  }
  .option:disabled{cursor:default;}
  .feedback{
    text-align:center;
    font-weight:700;
    padding:14px;
    border-radius:10px;
    margin-bottom:14px;
  }
  .feedback.bad{background:rgba(248,113,113,0.15);color:var(--bad);}
  .feedback.good{background:rgba(74,222,128,0.15);color:var(--good);}
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:20px 0;
  }
  .stat-box{
    background:rgba(0,0,0,0.25);
    border-radius:10px;
    padding:14px;
    text-align:center;
  }
  .stat-box .val{font-size:1.5em;font-weight:700;color:var(--accent2);}
  .stat-box .lab{font-size:0.8em;color:var(--muted);}
  .banner{
    text-align:center;
    font-size:0.85em;
    color:var(--muted);
    margin-top:16px;
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px;}
  @media (max-width:480px){
    .card{padding:22px;}
    h1{font-size:1.5em;}
    .timer{font-size:1.8em;}
  }
</style>
</head>
<body>
<div id="app"></div>

        ],
        correct: 3
      },
      {
        q: "Why should you take your time before entering a dynamic?",

const READING_SECONDS = 120; // 2 minutes

/* ============ STATE ============ */
let state = {
  screen: "start",      // start | reading | quiz | final
  sectionIndex: 0,
  timeLeft: READING_SECONDS,
  timerInterval: null,
  selectedAnswers: [],
  quizFeedback: null,   // null | 'bad'
  startedAt: null
};

let restartCountWrong = parseInt(sessionStorage.getItem('kst_restarts_wrong') || '0', 10);
let restartCountLeft = parseInt(sessionStorage.getItem('kst_restarts_left') || '0', 10);

/* ============ ANTI-CHEAT ============ */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());
document.addEventListener('paste', e => e.preventDefault());
document.addEventListener('selectstart', e => {
  // allow selection only inside reading text areas, block everywhere else attempted copy is still blocked above
});
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  // block common devtools / copy shortcuts
  if (e.key === 'F12') e.preventDefault();
  if ((e.ctrlKey || e.metaKey) && (k === 'c' || k === 'x' || k === 'u' || k === 's' || k === 'p')) e.preventDefault();
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) e.preventDefault();
});

let tabSwitchArmed = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden && tabSwitchArmed) {
    triggerCheatRestart("You switched away from the test.");
  }
});
window.addEventListener('blur', () => {
  if (tabSwitchArmed) {
    triggerCheatRestart("Focus left the test window.");
  }
});

function armAntiCheat(on){ tabSwitchArmed = on; }

function triggerCheatRestart(reason){
  if (state.screen === "start" || state.screen === "final") return;
  restartCountLeft++;
  sessionStorage.setItem('kst_restarts_left', restartCountLeft);
  resetToStart(reason);
}

/* ============ FLOW ============ */
function resetToStart(message){
  clearInterval(state.timerInterval);
  armAntiCheat(false);
  state = {
    screen: "start",
    sectionIndex: 0,
    timeLeft: READING_SECONDS,
    timerInterval: null,
    selectedAnswers: [],
    quizFeedback: null,
    startedAt: state.startedAt // keep original start time across restarts for total elapsed stat
  };
  render(message);
}

function beginTest(){
  state.startedAt = Date.now();
  state.gameId = generateGameId();
  restartCountWrong = 0;
  restartCountLeft = 0;
  sessionStorage.setItem('kst_restarts_wrong', 0);
  sessionStorage.setItem('kst_restarts_left', 0);
  goToReading(0);
}

function generateGameId(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no ambiguous chars (0/O, 1/I)
  let id = '';
  for (let i = 0; i < 8; i++){
    id += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return id.slice(0,4) + '-' + id.slice(4);
}

function getGameId(){
  return state.gameId || generateGameId();
}

function goToReading(i){
  clearInterval(state.timerInterval);
  state.screen = "reading";
  state.sectionIndex = i;
  state.timeLeft = READING_SECONDS;
  armAntiCheat(true);
  render();
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0){
      clearInterval(state.timerInterval);
    }
    updateTimerDisplay();
  }, 1000);
}

function goToQuiz(i){
  clearInterval(state.timerInterval);
  state.screen = "quiz";
  state.sectionIndex = i;
  state.selectedAnswers = new Array(SECTIONS[i].questions.length).fill(null);
  state.quizFeedback = null;
  armAntiCheat(true);
  render();
}

function submitQuiz(){
  const section = SECTIONS[state.sectionIndex];
  const allCorrect = section.questions.every((q, idx) => state.selectedAnswers[idx] === q.correct);
  if (!allCorrect){
    restartCountWrong++;
    sessionStorage.setItem('kst_restarts_wrong', restartCountWrong);
    resetToStart("You answered a question incorrectly.");
    return;
  }
  const next = state.sectionIndex + 1;
  if (next < SECTIONS.length){
    goToReading(next);
  } else {
    goToFinal();
  }
}

function goToFinal(){
  clearInterval(state.timerInterval);
  armAntiCheat(false);
  state.screen = "final";
  render();
}

/* ============ RENDER ============ */
const app = document.getElementById('app');

function progressDots(){
  let dots = '';
  SECTIONS.forEach((s, i) => {
    let cls = 'dot';
    if (i < state.sectionIndex) cls += ' done';
    else if (i === state.sectionIndex) cls += ' active';
    dots += `<span class="${cls}"></span>`;
  });
  return `<div class="progress-dots">${dots}</div>`;
}

function render(message){
  if (state.screen === "start"){
    app.innerHTML = `
      <div class="card">
        <h1>Femdom Cage Reading Test</h1>
        <p>This short test checks that you've read and understood five important topics: <b>Respect</b>, <b>SSC</b>, <b>Consent</b>, <b>Safewords</b>, and <b>Vetting</b>.</p>
        <p class="muted">Here's how it works:</p>
        <ul class="muted">
          <li>You'll read one section at a time. Each reading takes at least 3 minutes before you can continue — take your time.</li>
          <li>After each reading, you'll answer a few questions about it.</li>
          <li>You must answer every question correctly to move forward. Getting one wrong sends you back to the very start.</li>
          <li>Please stay on this tab and don't switch away — doing so will also restart the test.</li>
          <li>At the end, you'll see a short summary of your run.</li>
        </ul>
        ${message ? `<div class="feedback bad">${message}</div>` : ''}
        <button class="btn" onclick="beginTest()">Start the test</button>
      </div>
    `;
    return;
  }

  if (state.screen === "reading"){
    const section = SECTIONS[state.sectionIndex];
    app.innerHTML = `
      <div class="card">
        ${progressDots()}
        <h2>${section.title}</h2>
        <div class="reading-text">
          ${section.paragraphs.map(p => `<p>${p}</p>`).join('')}
        </div>
        <div class="timer" id="timerDisplay">${formatTime(state.timeLeft)}</div>
        <button class="btn" id="continueBtn" ${state.timeLeft > 0 ? 'disabled' : ''} onclick="goToQuiz(${state.sectionIndex})">
          ${state.timeLeft > 0 ? 'Please keep reading...' : 'Continue to questions'}
        </button>
        <p class="banner">Stay on this tab — leaving will restart the test.</p>
      </div>
    `;
    return;
  }

  if (state.screen === "quiz"){
    const section = SECTIONS[state.sectionIndex];
    app.innerHTML = `
      <div class="card">
        ${progressDots()}
        <h2>${section.title} — Check your understanding</h2>
        ${section.questions.map((q, qi) => `
          <div class="question">
            <p class="qtext">${qi + 1}. ${q.q}</p>
            ${q.options.map((opt, oi) => `
              <button class="option ${state.selectedAnswers[qi] === oi ? 'selected' : ''}"
                onclick="selectAnswer(${qi}, ${oi})">${opt}</button>
            `).join('')}
          </div>
        `).join('')}
        <button class="btn" ${state.selectedAnswers.includes(null) ? 'disabled' : ''} onclick="submitQuiz()">
          Submit answers
        </button>
        <p class="banner">Every answer must be correct to continue. One mistake restarts the whole test.</p>
      </div>
    `;
    return;
  }

  if (state.screen === "final"){
    const elapsedMs = Date.now() - state.startedAt;
    const totalMin = Math.floor(elapsedMs / 60000);
    const totalSec = Math.floor((elapsedMs % 60000) / 1000);
    app.innerHTML = `
      <div class="card">
        <h1>Test Complete</h1>
        <p>You've read and correctly answered questions on all four sections. Thank you for taking the time to engage carefully with this material.</p>
        <div class="stats">
          <div class="stat-box">
            <div class="val">${totalMin}m ${totalSec}s</div>
            <div class="lab">Total time taken</div>
          </div>
          <div class="stat-box">
            <div class="val">${restartCountWrong}</div>
            <div class="lab">Restarts from wrong answers</div>
          </div>
          <div class="stat-box">
            <div class="val">${restartCountLeft}</div>
            <div class="lab">Restarts from leaving the window</div>
          </div>
          <div class="stat-box">
            <div class="val">${SECTIONS.length}</div>
            <div class="lab">Sections completed</div>
          </div>
          <div class="stat-box">
            <div class="val">${SECTIONS.reduce((a,s)=>a+s.questions.length,0)}</div>
            <div class="lab">Questions answered correctly</div>
          </div>
        </div>
        <p class="muted">Game ID: ${getGameId()}</p>
      </div>
    `;
    return;
  }
}

function selectAnswer(qi, oi){
  state.selectedAnswers[qi] = oi;
  render();
}

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  const btn = document.getElementById('continueBtn');
  if (el) el.textContent = formatTime(state.timeLeft);
  if (btn && state.timeLeft <= 0){
    btn.disabled = false;
    btn.textContent = 'Continue to questions';
  }
}

function formatTime(s){
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// expose functions used in inline onclick
window.beginTest = beginTest;
window.goToQuiz = goToQuiz;
window.submitQuiz = submitQuiz;
window.selectAnswer = selectAnswer;

render();
</script>
</body>
</html>
